<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeedBridge UI Preview</title><style>
:root{--g:#176d61;--gd:#123b36;--m:#eaf5f2;--bg:#f5f7f5;--ink:#17312e;--mut:#6e817d;--ln:#dfe9e6}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:var(--gd);color:#fff;padding:25px 18px;display:flex;flex-direction:column}.logo{font-size:21px;font-weight:800}.logo b{color:#9bd6c8}.role{margin:28px 0 16px;padding:8px 10px;background:#ffffff12;border-radius:10px;width:max-content;font-size:11px;color:#b9d5ce}.nav{display:grid;gap:5px}.nav div{padding:12px;border-radius:11px;color:#b9d0cb;font-size:13px}.nav .a{background:#ffffff14;color:white}.impact{margin-top:auto;border:1px solid #ffffff15;background:#ffffff09;border-radius:15px;padding:15px;font-size:11px;line-height:1.6;color:#bad2cc}.main{padding-bottom:45px}.top{height:76px;background:#fff;border-bottom:1px solid var(--ln);padding:0 30px;display:flex;align-items:center}.top strong{font-size:14px}.top span{font-size:10px;color:var(--mut);display:block}.avatar{margin-left:auto;background:var(--m);color:var(--g);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800}.content{padding:30px;max-width:1350px}.hero{background:linear-gradient(135deg,#f0f7f4,#e6f2ed);border:1px solid #d7e9e3;border-radius:22px;padding:32px;display:flex;justify-content:space-between;align-items:center}.ey{font-size:10px;color:var(--g);font-weight:800;letter-spacing:.14em}.hero h1{font-size:32px;margin:9px 0 5px}.hero p{color:var(--mut);max-width:650px}.btn{background:var(--g);color:#fff;border:0;border-radius:11px;padding:12px 16px;font-weight:700}.heart{width:105px;height:105px;border-radius:30px;background:#fff;display:grid;place-items:center;font-size:44px;box-shadow:0 15px 35px #254a4214}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:20px 0}.stat{background:#fff;border:1px solid var(--ln);border-radius:17px;padding:18px}.stat span{font-size:11px;color:var(--mut)}.stat strong{display:block;font-size:30px;margin:12px 0 2px}.section{display:flex;justify-content:space-between;align-items:end;margin:25px 0 10px}.section h2{font-size:21px;margin:0}.section p{font-size:11px;color:var(--mut);margin:4px 0}.donation{display:grid;grid-template-columns:170px 1fr;background:#fff;border:1px solid var(--ln);border-radius:18px;overflow:hidden}.art{display:grid;place-items:center;font-size:72px;background:#f3f1e9}.detail{padding:22px}.badge{display:inline-block;background:var(--m);color:var(--g);font-size:9px;font-weight:800;border-radius:999px;padding:5px 8px}.detail h3{font-size:21px;margin:10px 0 3px}.detail p{font-size:11px;color:var(--mut)}.journey{display:flex;align-items:center;margin:26px 0}.step{text-align:center;font-size:9px;color:var(--g);width:72px}.dot{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:#fff;margin:auto auto 6px}.line{height:2px;background:#72b4a5;flex:1}.rec{background:#f5f9f7;border:1px solid #e0ebe7;border-radius:12px;padding:12px;color:var(--mut);font-size:11px}.rec b{color:var(--ink)}.tabs{position:fixed;right:18px;bottom:18px;background:#fff;border:1px solid var(--ln);box-shadow:0 12px 30px #0002;border-radius:14px;padding:7px;display:flex;gap:5px}.tabs button{border:0;background:#f3f6f5;border-radius:9px;padding:8px 11px;font-size:10px;font-weight:700}.tabs button.on{background:var(--g);color:#fff}.table{background:#fff;border:1px solid var(--ln);border-radius:17px;overflow:hidden}.row{display:grid;grid-template-columns:1.4fr .7fr 1fr .7fr;padding:14px 16px;border-top:1px solid #edf2f0;font-size:11px}.row.head{font-size:9px;color:#81928e;background:#fafcfc;border:0;font-weight:800}.progress{height:6px;background:#edf2f0;border-radius:9px;margin-top:6px}.progress i{display:block;height:100%;width:25%;background:var(--g);border-radius:9px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid var(--ln);border-radius:17px;padding:18px}.card h3{font-size:16px}.card p{font-size:10px;color:var(--mut);line-height:1.5}.route{background:#f7faf9;border-radius:10px;padding:10px;font-size:9px;color:var(--mut);margin:14px 0}.health{background:var(--gd);color:#fff;border-radius:20px;padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:25px}.health p{color:#bfd4cf;font-size:12px}.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.numbers div{background:#ffffff10;border-radius:13px;padding:16px;text-align:center}.numbers b{display:block;color:#a7ded1;font-size:23px}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{display:none}.stats,.cards{grid-template-columns:1fr 1fr}.content{padding:18px}.donation{grid-template-columns:1fr}.art{height:140px}}
</style></head><body><div id="app"></div><div class="tabs"><button onclick="show('DONOR')">Donor</button><button onclick="show('ORGANIZATION')">Organization</button><button onclick="show('VOLUNTEER')">Volunteer</button><button onclick="show('ADMIN')">Admin</button></div><script>
const data={DONOR:{name:'Priya Sharma',title:'Give with confidence',sub:'See exactly where your items can help most.',stats:[['Total donations',4],['Completed',3],['Items donated',22],['Unread updates',2]]},ORGANIZATION:{name:'Ravi Kumar',title:'Turn needs into action',sub:'Publish clear needs and track what is arriving.',stats:[['Active needs',3],['Fulfilled needs',10],['Items received',175],['Unread updates',1]]},VOLUNTEER:{name:'Arjun Reddy',title:'Move impact forward',sub:'Pick up matched donations and get them to the right place.',stats:[['Assigned pickups',8],['Completed',7],['Available nearby',3],['Unread updates',1]]},ADMIN:{name:'Meera Rao',title:'Keep the network trusted',sub:'Monitor organizations, needs, donations and handoffs.',stats:[['Organizations',46],['Donations',128],['Community needs',71],['Pickups',96]]}};
function extra(role){if(role==='DONOR')return `<div class="section"><div><h2>Your current donation</h2><p>The backpack example used in the end-to-end demo.</p></div></div><div class="donation"><div class="art">🎒</div><div class="detail"><span class="badge">MATCHED</span><h3>School Backpack</h3><p>DON-2026-00251 · 5 items · GOOD</p><div class="journey"><div class="step"><div class="dot">✓</div>Created</div><div class="line"></div><div class="step"><div class="dot">✓</div>AI analyzed</div><div class="line"></div><div class="step"><div class="dot">3</div>Matched</div><div class="line" style="background:#dfe8e5"></div><div class="step" style="color:#9badA8"><div class="dot" style="background:#fff;color:#9badA8;border:2px solid #dfe8e5">4</div>Pickup</div></div><div class="rec"><b>✨ AI recommendation</b><br>Suitable for donation. 96% match with Hope Community School.</div></div></div>`;
if(role==='ORGANIZATION')return `<div class="section"><div><h2>Open community needs</h2><p>Track progress without spreadsheets or email chains.</p></div><button class="btn">+ Create need</button></div><div class="table"><div class="row head"><div>NEED</div><div>PRIORITY</div><div>PROGRESS</div><div>STATUS</div></div><div class="row"><div><b>School Backpack</b><br><small>NEED-2026-00101</small></div><div>HIGH</div><div>5 received · 15 remaining<div class="progress"><i></i></div></div><div><span class="badge">PARTIAL</span></div></div><div class="row"><div><b>Notebook</b></div><div>MEDIUM</div><div>20 received · 30 remaining<div class="progress"><i style="width:40%"></i></div></div><div><span class="badge">PARTIAL</span></div></div></div>`;
if(role==='VOLUNTEER')return `<div class="section"><div><h2>Available pickups</h2><p>Choose a handoff you can complete.</p></div></div><div class="cards"><div class="card"><span class="badge">AVAILABLE</span><h3>5 × School Backpack</h3><p>Priya Sharma → Hope Community School</p><div class="route">Madhapur → Banjara Hills</div><button class="btn">Accept pickup</button></div><div class="card"><span class="badge">AVAILABLE</span><h3>8 × Winter Blanket</h3><p>Asha Verma → Helping Hands</p><div class="route">Jubilee Hills → Begumpet</div><button class="btn">Accept pickup</button></div></div>`;
return `<div class="section"><div><h2>Platform health</h2><p>Trust is designed into the workflow.</p></div></div><div class="health"><div><h2>Verified community network</h2><p>Organization verification, role-based access, matching thresholds and QR-backed handoffs make donations auditable.</p></div><div class="numbers"><div><b>96%</b>Top match</div><div><b>4</b>User roles</div><div><b>1</b>Handoff chain</div></div></div>`}
function show(role){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.textContent.toUpperCase().startsWith(role==='ORGANIZATION'?'ORGAN':role)));const d=data[role];document.getElementById('app').innerHTML=`<div class="shell"><aside class="side"><div class="logo">NeedBridge <b>AI</b></div><div class="role">✓ ${role.toLowerCase()}</div><div class="nav"><div class="a">▦ Overview</div><div>♡ ${role==='ORGANIZATION'?'Community needs':role==='VOLUNTEER'?'Available pickups':role==='ADMIN'?'Organizations':'My donations'}</div><div>◫ ${role==='DONOR'?'Smart matches':'Notifications'}</div></div><div class="impact">Community impact<br><b>Every useful item should find a home.</b></div></aside><main class="main"><div class="top"><div><span>NEEDBRIDGE WORKSPACE</span><strong>${role==='ORGANIZATION'?'Hope Community School':d.name}</strong></div><div class="avatar">${d.name.split(' ').map(x=>x[0]).join('')}</div></div><div class="content"><div class="hero"><div><span class="ey">THURSDAY, OCTOBER 23</span><h1>${d.title}, ${d.name.split(' ')[0]}.</h1><p>${d.sub}</p><button class="btn">${role==='DONOR'?'+ Start a donation':role==='ORGANIZATION'?'+ Create a need':role==='VOLUNTEER'?'View pickups':'Review organizations'}</button></div><div class="heart">♡</div></div><div class="stats">${d.stats.map(x=>`<div class="stat"><span>${x[0]}</span><strong>${x[1]}</strong><span>Current workspace</span></div>`).join('')}</div>${extra(role)}</div></main></div>`}
show('DONOR');
</script></body></html>
